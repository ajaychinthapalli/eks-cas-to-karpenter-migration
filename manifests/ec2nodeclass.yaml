apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: KarpenterNodeRole-achin16-workspace
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: achin16-workspace
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: achin16-workspace
  tags:
    karpenter.sh/discovery: achin16-workspace
